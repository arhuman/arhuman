name: GitHub metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg

          base: header, repositories
          base_indepth: yes

          # The activity section is disabled: GitHub stopped populating
          # payload.commits on push events, so the plugin throws on every
          # one of them (activity/index.mjs:140) and renders "Unexpected
          # error". No plugin_activity_* setting avoids it, the filters run
          # after the crashing handler. Upstream is unmaintained since 2023.
          plugin_activity: no
